version: '3.8'

services:
  web:
    build: ./services/web
    volumes:
      - ./services/web/:/usr/src/app/
      - ./services/web/media:/usr/src/app/media
    ports:
      - 5000:5000
    env_file:
      - ./.env.dev
    depends_on:
      - db
    environment:
      - PYTHONPATH=/usr/src/app
      - FLASK_APP=project/__init__.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: >
      sh -c "python -m project.load_mock_data;
             gunicorn --bind 0.0.0.0:5000 'project:create_app()'"
  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=hello_flask
      - POSTGRES_PASSWORD=hello_flask
      - POSTGRES_DB=hello_flask_dev

volumes:
  postgres_data:
