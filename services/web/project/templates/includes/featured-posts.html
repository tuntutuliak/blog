<section class="featured-posts">
    <h2 class="section-title">Избранные статьи</h2>
    <div class="row">
        {% for post in featured_posts %}
        <div class="col-md-6">
            <div class="card mb-4">
                {% if post.image %}
                <img src="{{ post.image }}" class="card-img-top" alt="{{ post.title }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncate(150) }}</p>
                    <a href="{{ url_for('blog.post', post_id=post.id) }}" class="btn btn-primary">Читать далее</a>
                </div>
                <div class="card-footer text-muted">
                    <small>Опубликовано: {{ post.created_at.strftime('%d.%m.%Y') }}</small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
